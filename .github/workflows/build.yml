name: Build APK with engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    # Если сборка идет в Alpine контейнере:
    container:
      image: alpine:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apk update
        apk add --no-cache git dtc bash python3 py3-pip meson ninja gcc g++ make glib-dev pixman-dev linux-headers

    - name: Зібрати QEMU (x86) у контейнері Alpine
      run: |
        chmod +x qemu-build/build-system.sh
        ./qemu-build/build-system.sh

    # ВАЖНО: Этот шаг сохраняет скомпилированный движок, чтобы его увидел шаг "apk"
    - name: Upload compiled engine artifact
      uses: actions/upload-artifact@v4
      with:
        name: engine
        # Замените путь ниже на реальную папку или файл, куда ваш build-system.sh сохраняет готовый QEMU
        path: qemu-build/build/

  apk:
    needs: engine
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Этот шаг теперь отработает успешно, так как артефакт с именем "engine" загружен выше
    - name: Run actions/download-artifact@v4
      uses: actions/download-artifact@v4
      with:
        name: engine
        path: app/src/main/jniLibs/ # Укажите путь, куда именно в Android-проект нужно положить бинарник движка

    - name: Покласти рушій у застосунок
      run: |
        echo "Перенос или проверка файлов движка..."

    - name: Run actions/setup-java@v4
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Run gradle/actions/setup-gradle@v4
      uses: gradle/actions/setup-gradle@v4

    - name: Зібрати APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Run actions/upload-artifact@v4
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
