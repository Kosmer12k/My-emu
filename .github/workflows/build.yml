name: Build APK with engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies on Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y git device-tree-compiler python3 python3-pip meson ninja-build libglib2.0-dev libpixman-1-dev

    - name: Зібрати QEMU (x86)
      run: |
        chmod +x qemu-build/build-system.sh
        ./qemu-build/build-system.sh

    - name: Prepare artifacts for upload
      run: |
        mkdir -p output_engine
        cp -r qemu-build/* output_engine/ || true

    - name: Upload compiled engine artifact
      uses: actions/upload-artifact@v4
      with:
        name: engine
        path: output_engine/

  apk:
    needs: engine
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run actions/download-artifact@v4
      uses: actions/download-artifact@v4
      with:
        name: engine
        path: app/src/main/jniLibs/

    - name: Run actions/setup-java@v4
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Run gradle/actions/setup-gradle@v4
      uses: gradle/actions/setup-gradle@v4

    - name: Зібрати APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Run actions/upload-artifact@v4
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
