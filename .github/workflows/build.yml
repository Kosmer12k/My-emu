name: Build APK with engine

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-venv python3-pip \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev flex bison wget

      - name: Download QEMU source
        run: |
          wget https://qemu.org
          tar -xf qemu-9.1.0.tar.xz
          mv qemu-9.1.0/* .

      - name: Зібрати QEMU (x86)
        run: |
          chmod +x qemu-build/build-system.sh
          ./qemu-build/build-system.sh

      - name: Upload compiled engine
        uses: actions/upload-artifact@v4
        with:
          name: qemu-engine
          path: |
            # Укажите здесь путь, куда ваш build-system.sh складывает готовый бинарник
            build-qemu/qemu-system-x86_64
            
