name: Build APK with engine

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-venv python3-pip \
            ninja-build pkg-config libglib2.0-dev libpixman-1-dev flex bison

      - name: Download QEMU source
        run: |
          git clone --depth 1 --branch v9.1.0 https://gitlab.com qemu-src
          cp -rn qemu-src/* .
          rm -rf qemu-src

      - name: Зібрати QEMU (x86)
        run: |
          chmod +x qemu-build/build-system.sh
          ./qemu-build/build-system.sh

      - name: Upload compiled engine
        uses: actions/upload-artifact@v4
        with:
          name: qemu-engine
          path: |
            build/qemu-system-x86_64
            build/qemu-system-i386
          if-no-files-found: warn

  apk:
    needs: engine
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download compiled engine
        uses: actions/download-artifact@v4
        with:
          name: qemu-engine
          path: app/src/main/assets/

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-emu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
